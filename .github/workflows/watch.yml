name: 채용공고 감시

on:
  schedule:
    # 30분마다. 회사 수가 많고 그중 절반 이상이 Playwright로 브라우저를 띄워서 읽기
    # 때문에(1회 실행에 약 1~2분) 15분보다 여유를 뒀다 - private 저장소는 GitHub
    # Actions 무료 사용량(월 2000분)이 있으니 필요하면 이 값을 조정하거나, 저장소를
    # public으로 돌려 무제한 사용량을 쓰는 걸 고려할 것.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# 같은 워크플로우가 겹쳐 돌면서 state.json에 서로 다른 커밋을 만들지 않도록 직렬화
concurrency:
  group: recruit-alert
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r hanwha-recruit-alert/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run watcher
        working-directory: hanwha-recruit-alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hanwha-recruit-alert/state.json
          git diff --cached --quiet || git commit -m "chore: update seen job postings state"
          git push
